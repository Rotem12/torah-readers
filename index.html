    <script>
      if ('serviceWorker' in navigator) {
        const updateNotice = document.getElementById('app-update-notice');
        const updateButton = document.getElementById('app-update-now');
        let registration = null;
        let lastController = navigator.serviceWorker.controller;
        let isReloading = false;

        const showUpdateNotice = () => {
          if (registration?.waiting && navigator.serviceWorker.controller) updateNotice.hidden = false;
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          const currentController = navigator.serviceWorker.controller;
          if (!lastController) {
            lastController = currentController;
            return;
          }
          if (currentController === lastController || isReloading) return;
          lastController = currentController;
          isReloading = true;
          window.location.reload();
        });

        updateButton.addEventListener('click', () => {
          if (!registration?.waiting) return;
          updateButton.disabled = true;
          updateButton.textContent = 'מעדכן…';
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        });

        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
          .then(value => {
            registration = value;
            showUpdateNotice();
            registration.addEventListener('updatefound', () => {
              const installing = registration.installing;
              if (installing) installing.addEventListener('statechange', showUpdateNotice);
            });
            window.addEventListener('focus', () => {
              registration.update().catch(error => console.error('Service worker update check failed.', error));
            });
          })
          .catch(error => console.error('Service worker registration failed.', error));
      }
    </script>
